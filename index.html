<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><title>&#x6027;&#x53d6;&#x5411;&#x503e;&#x5411;&#x6d4b;&#x8bd5;</title><style>* { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, "Microsoft YaHei", sans-serif; } body { background: hsl(210, 8%, 95%); color: hsl(220, 10%, 30%); line-height: 1.6; padding: 16px; min-height: 100vh; } .container { max-width: 600px; margin: 0 auto; } .card { background: hsl(0, 0%, 100%); border-radius: 16px; box-shadow: 0 4px 12px hsla(210, 10%, 70%, 0.15); padding: 24px; margin-bottom: 20px; transition: transform 0.2s ease; } .card:active { transform: translateY(1px); } .question-card { min-height: 280px; display: flex; flex-direction: column; } .question-number { color: hsl(210, 12%, 55%); font-size: 0.85rem; margin-bottom: 8px; } .question-text { font-size: 1.15rem; font-weight: 500; margin-bottom: 24px; flex-grow: 1; line-height: 1.5; } .options { display: grid; grid-template-columns: 1fr; gap: 12px; } .option-btn { background: hsl(210, 8%, 93%); border: none; border-radius: 12px; padding: 16px; text-align: left; font-size: 1rem; color: hsl(220, 10%, 35%); cursor: pointer; transition: all 0.2s ease; box-shadow: 0 2px 4px hsla(210, 10%, 70%, 0.05); } .option-btn:hover { background: hsl(210, 10%, 90%); transform: translateY(-1px); } .option-btn:focus { outline: none; box-shadow: 0 0 0 3px hsla(210, 10%, 70%, 0.3); } .results { display: none; flex-direction: column; gap: 24px; } .result-header { text-align: center; margin-bottom: 16px; } .result-title { font-size: 1.4rem; margin-bottom: 8px; color: hsl(220, 10%, 25%); } .result-desc { color: hsl(210, 10%, 45%); font-size: 0.95rem; } .ratios { display: flex; flex-direction: column; gap: 16px; } .ratio-item { display: flex; align-items: center; gap: 12px; } .ratio-icon { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; } .ratio-label { flex-grow: 1; font-size: 0.95rem; color: hsl(220, 10%, 40%); } .ratio-value { font-weight: 600; color: hsl(220, 10%, 30%); min-width: 50px; text-align: right; } .chart-container { position: relative; height: 240px; margin: 10px 0 20px; } .progress { height: 4px; background: hsl(210, 8%, 90%); border-radius: 2px; overflow: hidden; margin: 16px 0; } .progress-bar { height: 100%; border-radius: 2px; transition: width 0.4s ease; } @media (min-width: 768px) { .options { grid-template-columns: 1fr 1fr; } }</style></head><body><div class="container"><div class="progress"><div class="progress-bar" id="progressBar" style="width: 10%;"></div></div><div id="questionContainer"></div><div class="results" id="results"><div class="card result-header"><h2 class="result-title">&#x60a8;&#x7684;&#x503e;&#x5411;&#x5206;&#x5e03;</h2><p class="result-desc">&#x57fa;&#x4e8e;10&#x4e2a;&#x95ee;&#x9898;&#x7684;&#x7efc;&#x5408;&#x5206;&#x6790;&#xff08;&#x7ed3;&#x679c;&#x4ec5;&#x4f9b;&#x53c2;&#x8003;&#xff09;</p></div><div class="card"><div class="ratios" id="ratiosList"></div></div><div class="card"><div class="chart-container"><canvas id="resultChart"></canvas></div></div></div></div><script>const testQuestions = [ { text: "\u60a8\u901a\u5e38\u5bf9\u54ea\u79cd\u6027\u522b\u7684\u4eba\u4ea7\u751f\u6d6a\u6f2b\u5174\u8da3\uff1f", options: ["\u4e3b\u8981\u662f\u5f02\u6027", "\u4e3b\u8981\u662f\u540c\u6027", "\u4e24\u79cd\u6027\u522b\u90fd\u53ef\u80fd", "\u90fd\u4e0d\u611f\u5174\u8da3"] }, { text: "\u5728\u793e\u4ea4\u573a\u5408\u4e2d\uff0c\u60a8\u66f4\u5bb9\u6613\u88ab\u54ea\u79cd\u6027\u522b\u5438\u5f15\uff1f", options: ["\u5f02\u6027", "\u540c\u6027", "\u4e24\u79cd\u6027\u522b", "\u5f88\u5c11\u88ab\u5438\u5f15"] }, { text: "\u60a8\u60f3\u8c61\u4e2d\u7684\u7406\u60f3\u4f34\u4fa3\u901a\u5e38\u662f\uff1f", options: ["\u5f02\u6027", "\u540c\u6027", "\u6027\u522b\u4e0d\u91cd\u8981", "\u6ca1\u6709\u7279\u5b9a\u60f3\u8c61"] }, { text: "\u5f53\u770b\u5230\u4eb2\u5bc6\u5173\u7cfb\u65f6\uff0c\u60a8\u66f4\u5e38\u8054\u60f3\u5230\uff1f", options: ["\u7537\u5973\u7ec4\u5408", "\u540c\u6027\u7ec4\u5408", "\u5404\u79cd\u7ec4\u5408", "\u4e0d\u5173\u6ce8\u5173\u7cfb\u7c7b\u578b"] }, { text: "\u60a8\u5bf9\u81ea\u8eab\u6027\u522b\u8ba4\u540c\u7684\u611f\u53d7\u662f\uff1f", options: ["\u4e0e\u751f\u7406\u6027\u522b\u4e00\u81f4", "\u4e0e\u751f\u7406\u6027\u522b\u4e0d\u4e00\u81f4", "\u6d41\u52a8\u53d8\u5316", "\u96be\u4ee5\u5b9a\u4e49"] }, { text: "\u6d6a\u6f2b\u5173\u7cfb\u4e2d\uff0c\u60a8\u66f4\u91cd\u89c6\uff1f", options: ["\u6027\u522b\u4e92\u8865\u6027", "\u6027\u522b\u76f8\u4f3c\u6027", "\u60c5\u611f\u8054\u7ed3\u672c\u8eab", "\u975e\u6027\u522b\u56e0\u7d20"] }, { text: "\u60a8\u5bf9\u8de8\u6027\u522b\u8005\u7684\u7406\u89e3\u7a0b\u5ea6\uff1f", options: ["\u4e0d\u592a\u4e86\u89e3", "\u57fa\u672c\u4e86\u89e3", "\u8f83\u6df1\u5165\u4e86\u89e3", "\u6709\u4eb2\u8eab\u7ecf\u5386"] }, { text: "\u6027\u5438\u5f15\u529b\u5bf9\u60a8\u800c\u8a00\uff1f", options: ["\u4e3b\u8981\u6765\u81ea\u5f02\u6027", "\u4e3b\u8981\u6765\u81ea\u540c\u6027", "\u591a\u79cd\u6765\u6e90", "\u4e0d\u663e\u8457"] }, { text: "\u60a8\u8ba4\u4e3a\u6027\u53d6\u5411\u662f\uff1f", options: ["\u56fa\u5b9a\u4e0d\u53d8\u7684", "\u53ef\u80fd\u53d8\u5316", "\u8fde\u7eed\u5149\u8c31", "\u96be\u4ee5\u5b9a\u4e49"] }, { text: "\u5728\u4eb2\u5bc6\u5173\u7cfb\u4e2d\uff0c\u60a8\u6700\u770b\u91cd\uff1f", options: ["\u4f20\u7edf\u6027\u522b\u89d2\u8272", "\u5e73\u7b49\u4f19\u4f34\u5173\u7cfb", "\u60c5\u611f\u6df1\u5ea6\u672c\u8eab", "\u81ea\u7531\u8868\u8fbe\u65b9\u5f0f"] } ]; const categories = [ { id: 'hetero', name: '\u5f02\u6027\u503e\u5411', color: 'hsl(340, 12%, 75%)' }, { id: 'homo', name: '\u540c\u6027\u503e\u5411', color: 'hsl(220, 12%, 75%)' }, { id: 'bi', name: '\u53cc\u6027\u503e\u5411', color: 'hsl(280, 12%, 75%)' }, { id: 'other', name: '\u5176\u4ed6\u503e\u5411', color: 'hsl(180, 12%, 75%)' } ]; let currentQuestion = 0; const userAnswers = []; function initTest() { renderQuestion(); updateProgress(); } function renderQuestion() { const container = document.getElementById('questionContainer'); const question = testQuestions[currentQuestion]; container.innerHTML = ` <div class="card question-card"> <div class="question-number">\u95ee\u9898 ${currentQuestion + 1}/10</div> <div class="question-text">${question.text}</div> <div class="options"> ${question.options.map((option, index) => `<button class="option-btn" onclick="selectAnswer(${index})">${option}</button>`).join('')} </div> </div> `; } function selectAnswer(optionIndex) { userAnswers[currentQuestion] = optionIndex; currentQuestion++; if (currentQuestion < testQuestions.length) { renderQuestion(); updateProgress(); } else { showResults(); } } function updateProgress() { const progress = (currentQuestion / testQuestions.length) * 100; document.getElementById('progressBar').style.width = `${progress}%`; } function showResults() { const categoryCounts = Array(categories.length).fill(0); userAnswers.forEach(answer => { categoryCounts[answer]++; }); const ratiosList = document.getElementById('ratiosList'); ratiosList.innerHTML = categories.map((cat, index) => { const count = categoryCounts[index]; const percent = Math.round((count / testQuestions.length) * 100); return ` <div class="ratio-item"> <div class="ratio-icon" style="background:${cat.color}"></div> <div class="ratio-label">${cat.name}</div> <div class="ratio-value">${percent}%</div> </div> `; }).join(''); document.getElementById('questionContainer').style.display = 'none'; document.getElementById('results').style.display = 'flex'; drawChart(categoryCounts); } function drawChart(counts) { const canvas = document.getElementById('resultChart'); const ctx = canvas.getContext('2d'); const radius = Math.min(canvas.width, canvas.height) / 2 * 0.8; const displayWidth = Math.min(500, window.innerWidth - 64); canvas.width = displayWidth; canvas.height = 240; const centerX = canvas.width / 2; const centerY = canvas.height / 2; const total = testQuestions.length; let startAngle = 0; counts.forEach((count, i) => { const category = categories[i]; const sliceAngle = (count / total) * Math.PI * 2; ctx.beginPath(); ctx.moveTo(centerX, centerY); ctx.arc(centerX, centerY, radius, startAngle, startAngle + sliceAngle); ctx.closePath(); ctx.fillStyle = category.color; ctx.fill(); ctx.strokeStyle = 'hsl(0, 0%, 95%)'; ctx.lineWidth = 1; ctx.stroke(); startAngle += sliceAngle; }); ctx.beginPath(); ctx.arc(centerX, centerY, radius * 0.15, 0, Math.PI * 2); ctx.fillStyle = 'hsl(0, 0%, 98%)'; ctx.fill(); const gradient = ctx.createRadialGradient( centerX, centerY, radius * 0.15, centerX, centerY, radius ); gradient.addColorStop(0, 'hsla(0, 0%, 100%, 0)'); gradient.addColorStop(1, 'hsla(0, 0%, 90%, 0.2)'); ctx.fillStyle = gradient; ctx.beginPath(); ctx.arc(centerX, centerY, radius, 0, Math.PI * 2); ctx.fill(); } window.onload = initTest;</script></body></html>
